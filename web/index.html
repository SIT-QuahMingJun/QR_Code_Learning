<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Encoder Learning</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5f7; color: #15202b; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 1.5rem; border-radius: 1rem; background: #fff; box-shadow: 0 0.5rem 2rem #15202b1a; }
    form { display: grid; gap: 0.75rem; grid-template-columns: 1fr auto auto; }
    input, select, button { font: inherit; padding: 0.65rem 0.8rem; border-radius: 0.45rem; border: 1px solid #aab5bf; }
    button { border-color: #0b5cab; background: #0b5cab; color: #fff; cursor: pointer; }
    .qr-frame { display: grid; place-items: center; margin-top: 1.25rem; padding: 1rem; overflow: auto; background: #fff; }
    canvas { display: block; background: #fff; image-rendering: pixelated; image-rendering: crisp-edges; }
    #status { min-height: 1.5em; margin: 0.75rem 0 0; }
    @media (max-width: 34rem) { form { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>QR encoder learning demo</h1>
    <form id="qr-form">
      <input id="payload" aria-label="QR payload" value="HELLO WORLD" maxlength="200" autocomplete="off">
      <select id="ec" aria-label="Error correction level">
        <option value="0">L — 7%</option><option value="1" selected>M — 15%</option>
        <option value="2">Q — 25%</option><option value="3">H — 30%</option>
      </select>
      <button type="submit">Generate</button>
    </form>
    <p id="status" role="status">Loading encoder…</p>
    <div class="qr-frame"><canvas id="qr" aria-label="Generated QR code"></canvas></div>
  </main>
  <script src="index.js"></script>
  <script>
    const QUIET_ZONE_MODULES = 4;
    const MODULE_PIXELS = 10;
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#qr');
    const context = canvas.getContext('2d', { alpha: false });
    let wasm;

    function renderQr() {
      const text = document.querySelector('#payload').value;
      const ec = Number(document.querySelector('#ec').value);
      const version = wasm.ccall('qr_encode', 'number', ['string', 'number'], [text, ec]);
      if (version < 1) throw new Error('The payload is too long or could not be encoded.');

      const size = wasm.ccall('qr_get_size', 'number');
      const canvasModules = size + QUIET_ZONE_MODULES * 2;
      canvas.width = canvasModules * MODULE_PIXELS;
      canvas.height = canvasModules * MODULE_PIXELS;
      context.imageSmoothingEnabled = false;
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#000000';

      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (wasm.ccall('qr_get_module', 'number', ['number', 'number'], [row, col])) {
            context.fillRect((col + QUIET_ZONE_MODULES) * MODULE_PIXELS,
                             (row + QUIET_ZONE_MODULES) * MODULE_PIXELS,
                             MODULE_PIXELS, MODULE_PIXELS);
          }
        }
      }
      status.textContent = `Version ${version}, ${size} × ${size} modules, ${['L', 'M', 'Q', 'H'][ec]}-level error correction.`;
    }

    document.querySelector('#qr-form').addEventListener('submit', (event) => {
      event.preventDefault();
      try { renderQr(); } catch (error) { status.textContent = error.message; }
    });

    createQRModule().then((module) => {
      wasm = module;
      renderQr();
    }).catch((error) => { status.textContent = `WASM failed to load: ${error.message}`; });
  </script>
</body>
</html>
